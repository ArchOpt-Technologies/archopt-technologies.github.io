<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | ArchOpt Technologies</title>
<meta name="robots" content="noindex">
<script>
/* send addresses typed with different letter case, a trailing slash or .html to the right page */
(function(){
  var pages={energyfront:'/EnergyFront',parevia:'/PareVia',epcalibration:'/EPCalibration',pricing:'/Pricing',terms:'/Terms',privacy:'/Privacy',refund:'/Refund',overview:'/',suite:'/',home:'/',index:'/'};
  var p=window.location.pathname.toLowerCase().replace(/\/+$/,'').replace(/\.html$/,'').replace(/^\//,'');
  if(pages[p]&&pages[p]!==window.location.pathname)window.location.replace(pages[p]+window.location.search+window.location.hash);
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
