name: Copy Assets from Old Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout New Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Old Repo and Copy Folders Exactly
        run: |
          # Clone the old repo into a folder named "old"
          git clone https://github.com/Net-Zero-GCC/optimization.github.io old

          # Copy folders and files exactly as named
          cp -r "old/ARCHOPT tool pictures" ./
          #cp -r "old/EPCalibration" ./
          #cp "old/Pictures - ARCHOPT Cover.png" ./
          #cp "old/Pictures -EPCalibration cover.png" ./
          #cp "old/ARCHOPT Technologies.png" ./
                   # Copy installer/download pages
          #cp "old/archopt.html" ./
          #cp "old/epcalibration.html" ./

          # Clean up
          rm -rf old

      - name: Commit and Push to New Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Copy ARCHOPT and EPCalibration assets from old repo"
            git push origin main
          fi
